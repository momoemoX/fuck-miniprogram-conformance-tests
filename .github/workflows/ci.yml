name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: tools/visual/package-lock.json
      - name: Install visual tool dependencies
        run: npm ci --prefix tools/visual
      - name: Run offline suite checks
        run: npm run check
